services:
  redis-main:
    image: redis:7-alpine
    ports:
      - "6000:6379"
    networks:
      - valuator-network

  redis-ru:
    image: redis:7-alpine
    ports:
      - "6001:6379"
    networks:
      - valuator-network

  redis-eu:
    image: redis:7-alpine
    ports:
      - "6002:6379"
    networks:
      - valuator-network

  redis-asia:
    image: redis:7-alpine
    ports:
      - "6003:6379"
    networks:
      - valuator-network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "15672:15672"
    expose:
      - "5672"
    environment:
      - RABBITMQ_DEFAULT_USER=valuator
      - RABBITMQ_DEFAULT_PASS=valuator
    networks:
      - valuator-network

  valuator-app:
    build:
      context: .
      dockerfile: Valuator/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - DB_MAIN=redis-main:6379
      - DB_RU=redis-ru:6379
      - DB_EU=redis-eu:6379
      - DB_ASIA=redis-asia:6379
      - DATA_PROTECTION_PATH=/app/keys
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=valuator
      - RABBITMQ_PASSWORD=valuator
      - RABBITMQ_QUEUE=rank-calculation
      - RABBITMQ_EVENTS_EXCHANGE=events
    expose:
      - "5000"
    depends_on:
      - redis-main
      - redis-ru
      - redis-eu
      - redis-asia
      - rabbitmq
    volumes:
      - data-protection-keys:/app/keys
    networks:
      - valuator-network

  rank-calculator:
    build:
      context: .
      dockerfile: RankCalculator/Dockerfile
    environment:
      - DB_MAIN=redis-main:6379
      - DB_RU=redis-ru:6379
      - DB_EU=redis-eu:6379
      - DB_ASIA=redis-asia:6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=valuator
      - RABBITMQ_PASSWORD=valuator
      - RABBITMQ_QUEUE=rank-calculation
      - RABBITMQ_EVENTS_EXCHANGE=events
    depends_on:
      - redis-main
      - redis-ru
      - redis-eu
      - redis-asia
      - rabbitmq
    networks:
      - valuator-network

  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./Valuator/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - valuator-app
    networks:
      - valuator-network

  events-logger:
    build:
      context: ./EventsLogger
      dockerfile: Dockerfile
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=valuator
      - RABBITMQ_PASSWORD=valuator
      - RABBITMQ_EVENTS_EXCHANGE=events
    depends_on:
      - rabbitmq
    networks:
      - valuator-network

networks:
  valuator-network:
    driver: bridge

volumes:
  data-protection-keys:
