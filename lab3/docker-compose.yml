services:
  redis:
    image: redis:7-alpine
    # image: harbor.ispring.lan/vendor/redis:5.0.3
    container_name: valuator-redis
    ports:
      - "6379:6379"
    networks:
      - valuator-network

  valuator-app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - REDIS_HOST=redis
    expose:
      - "5000"
    depends_on:
      - redis
    networks:
      - valuator-network

  nginx:
    # image: harbor.ispring.lan/vendor/openresty:1.25.3.1-3-bookworm-amd64
    image: nginx:alpine
    container_name: valuator-nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - valuator-app
    networks:
      - valuator-network

networks:
  valuator-network:
    driver: bridge
