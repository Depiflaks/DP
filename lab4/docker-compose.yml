services:
  redis:
    image: redis:7-alpine
    container_name: valuator-redis
    expose:
      - "6379"
    networks:
      - valuator-network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: valuator-rabbitmq
    ports:
      - "15672:15672"
    expose:
      - "5672"
    environment:
      - RABBITMQ_DEFAULT_USER=valuator
      - RABBITMQ_DEFAULT_PASS=valuator
    networks:
      - valuator-network

  valuator-app:
    build:
      context: ./Valuator
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=valuator
      - RABBITMQ_PASSWORD=valuator
      - RABBITMQ_QUEUE=rank-calculation
      - RABBITMQ_EVENTS_EXCHANGE=events
    expose:
      - "5000"
    depends_on:
      - redis
      - rabbitmq
    networks:
      - valuator-network

  rank-calculator:
    build:
      context: ./RankCalculator
      dockerfile: Dockerfile
    environment:
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=valuator
      - RABBITMQ_PASSWORD=valuator
      - RABBITMQ_QUEUE=rank-calculation
      - RABBITMQ_EVENTS_EXCHANGE=events
    depends_on:
      - redis
      - rabbitmq
    networks:
      - valuator-network

  nginx:
    image: nginx:alpine
    container_name: valuator-nginx
    ports:
      - "8080:8080"
    volumes:
      - ./Valuator/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - valuator-app
    networks:
      - valuator-network

  events-logger:
    build:
      context: ./EventsLogger
      dockerfile: Dockerfile
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=valuator
      - RABBITMQ_PASSWORD=valuator
      - RABBITMQ_EVENTS_EXCHANGE=events
    depends_on:
      - rabbitmq
    networks:
      - valuator-network

networks:
  valuator-network:
    driver: bridge
